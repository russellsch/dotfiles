# TTY-compatible starship config
# No Nerd Fonts, no hex colors, no emoji — plain text + basic ANSI only
"$schema" = 'https://starship.rs/config-schema.json'

format = '$all$container$line_break$os$character'

continuation_prompt = '[.](bright-black) '

# Starship modules
[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"
vimcmd_symbol = "[<](bold green)"
vimcmd_visual_symbol = "[<](bold yellow)"
vimcmd_replace_symbol = "[<](bold magenta)"
vimcmd_replace_one_symbol = "[<](bold magenta)"

[line_break]
disabled = false

[directory]
truncation_length = 4
style = "bold blue"
read_only = " ro"

[git_branch]
symbol = "git "
style = "bold magenta"
truncation_symbol = "..."

[git_commit]
tag_symbol = " tag "

[git_status]
ahead = ">"
behind = "<"
diverged = "<>"
renamed = "r"
deleted = "x"

[hostname]
ssh_symbol = "ssh "

[jobs]
symbol = "*"

[os]
disabled = true

[container]
format = 'in [$symbol \[$name\]]($style) '

[os.symbols]
Alpine = "alp "
Arch = "rch "
Debian = "deb "
Fedora = "fed "
Linux = "lnx "
Manjaro = "mjo "
Mint = "mint "
NixOS = "nix "
Pop = "pop "
Raspbian = "rasp "
Ubuntu = "ubnt "
Unknown = "unk "

[direnv]
disabled = false

[sudo]
disabled = false
symbol = "su"
format = '[\[$symbol\]]($style) '
style = 'bold yellow'

[shlvl]
disabled = false

[username]
disabled = false

