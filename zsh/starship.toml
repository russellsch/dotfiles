# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = '$all'

# Sets user-defined palette
# Palettes must be defined _after_ this line
palette = "catppuccin_macchiato"

continuation_prompt = '▶▶ '

# Starship modules
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[line_break]
disabled = false

[git_branch]
style = "bold mauve"

[directory]
truncation_length = 4
style = "bold lavender"

[os]
disabled = false
style = "lavender"

[sudo]
disabled = false
symbol = "󱐋"
format = '[\[$symbol\]]($style) '
style = 'bold yellow'

[username]
disabled = false

[cpp]
detect_files = ['BUILD', 'WORKSPACE', 'WORKSPACE.bzlmod']
disabled = false

[os.symbols]
Pop = ' '
Mint = '󰣭 '

